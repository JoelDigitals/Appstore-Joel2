{% extends "base.html" %}

{% block title %}API-Schlüssel erstellt{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center">
  <div class="glass rounded-3xl p-8 border border-green-500/20 bg-green-500/5">
    <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-green-500/10 flex items-center justify-center">
      <i class="bi bi-check-circle-fill text-3xl text-green-400"></i>
    </div>
    <h1 class="text-2xl font-bold text-gray-100 mb-2">API-Schlüssel erstellt</h1>
    <p class="text-gray-400 mb-6">Speichere diesen Schlüssel sicher. Er wird nicht erneut angezeigt.</p>
    
    <div class="bg-slate-800/50 rounded-xl p-4 mb-6 border border-gray-700">
      <code class="text-sm text-primary break-all select-all">{{ token.key }}</code>
    </div>
    
    <button onclick="navigator.clipboard.writeText('{{ token.key }}')" class="w-full py-3 mb-3 bg-primary/10 hover:bg-primary/20 text-primary border border-primary/20 rounded-xl transition-all flex items-center justify-center gap-2">
      <i class="bi bi-clipboard"></i>
      In Zwischenablage kopieren
    </button>
    
    <a href="{% url 'api_keys' %}" class="block w-full py-3 glass hover:bg-gray-700/50 text-gray-300 rounded-xl transition-all">
      Zurück zur Übersicht
    </a>
  </div>
</div>
{% endblock %}
