{% extends "base.html" %}

{% block title %}Erscheinungsbild{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <nav class="flex items-center gap-2 text-sm text-gray-500 mb-6">
    <a href="{% url 'user_settings' %}" class="hover:text-primary transition-colors">
      <i class="bi bi-sliders2"></i> Einstellungen
    </a>
    <i class="bi bi-chevron-right text-xs"></i>
    <span class="text-gray-300">Erscheinungsbild</span>
  </nav>

  <h1 class="text-3xl font-bold text-gray-100 mb-8 flex items-center gap-3">
    <i class="bi bi-palette-fill text-primary"></i>
    Erscheinungsbild
  </h1>

  <div class="glass rounded-3xl p-6 md:p-8">
    <form method="post" class="space-y-8">
      {% csrf_token %}

      <!-- Theme -->
      <div>
        <label class="text-sm font-medium text-gray-300 mb-4 block">Theme</label>
        <div class="grid grid-cols-3 gap-4">
          <label class="cursor-pointer">
            <input type="radio" name="theme" value="dark" {% if profile.theme == 'dark' %}checked{% endif %} class="sr-only peer">
            <div class="p-4 rounded-xl bg-slate-800/50 border-2 border-gray-700 peer-checked:border-primary peer-checked:bg-primary/10 transition-all text-center">
              <i class="bi bi-moon-fill text-2xl text-gray-400 peer-checked:text-primary mb-2 block"></i>
              <span class="text-sm text-gray-300">Dunkel</span>
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="theme" value="light" {% if profile.theme == 'light' %}checked{% endif %} class="sr-only peer">
            <div class="p-4 rounded-xl bg-slate-800/50 border-2 border-gray-700 peer-checked:border-primary peer-checked:bg-primary/10 transition-all text-center">
              <i class="bi bi-sun-fill text-2xl text-gray-400 peer-checked:text-primary mb-2 block"></i>
              <span class="text-sm text-gray-300">Hell</span>
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="theme" value="auto" {% if profile.theme == 'auto' %}checked{% endif %} class="sr-only peer">
            <div class="p-4 rounded-xl bg-slate-800/50 border-2 border-gray-700 peer-checked:border-primary peer-checked:bg-primary/10 transition-all text-center">
              <i class="bi bi-circle-half text-2xl text-gray-400 peer-checked:text-primary mb-2 block"></i>
              <span class="text-sm text-gray-300">System</span>
            </div>
          </label>
        </div>
      </div>

      <!-- Accent Color -->
      <div>
        <label class="text-sm font-medium text-gray-300 mb-4 block">Akzentfarbe</label>
        <div class="flex gap-3 flex-wrap">
          {% for color in 'blue,purple,green,red,orange,pink,cyan'|split:',' %}
          <label class="cursor-pointer">
            <input type="radio" name="accent_color" value="{{ color }}" {% if profile.accent_color == color %}checked{% endif %} class="sr-only peer">
            <div class="w-12 h-12 rounded-full bg-{{ color }}-500 border-4 border-transparent peer-checked:border-white transition-all shadow-lg"></div>
          </label>
          {% endfor %}
        </div>
      </div>

      <!-- Font Size -->
      <div>
        <label class="text-sm font-medium text-gray-300 mb-4 block">Schriftgröße</label>
        <input type="range" name="font_size" min="1" max="3" value="{% if profile.font_size == 'small' %}1{% elif profile.font_size == 'large' %}3{% else %}2{% endif %}"
               class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-primary">
        <div class="flex justify-between text-xs text-gray-500 mt-2">
          <span>Klein</span>
          <span>Normal</span>
          <span>Groß</span>
        </div>
      </div>

      <!-- Toggles -->
      <div class="space-y-4">
        <label class="flex items-center justify-between p-4 bg-slate-800/30 rounded-xl cursor-pointer">
          <div>
            <span class="text-gray-100 font-medium">Kompaktmodus</span>
            <p class="text-xs text-gray-500">Weniger Abstände, mehr Inhalt</p>
          </div>
          <input type="checkbox" name="compact_mode" {% if profile.compact_mode %}checked{% endif %} 
                 class="w-14 h-7 bg-gray-700 rounded-full peer appearance-none checked:bg-primary transition-all relative after:absolute after:top-0.5 after:left-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all checked:after:translate-x-full">
        </label>

        <label class="flex items-center justify-between p-4 bg-slate-800/30 rounded-xl cursor-pointer">
          <div>
            <span class="text-gray-100 font-medium">Animationen</span>
            <p class="text-xs text-gray-500">Übergänge und Effekte</p>
          </div>
          <input type="checkbox" name="animations_enabled" {% if profile.animations_enabled %}checked{% endif %}
                 class="w-14 h-7 bg-gray-700 rounded-full peer appearance-none checked:bg-primary transition-all relative after:absolute after:top-0.5 after:left-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all checked:after:translate-x-full">
        </label>
      </div>

      <div class="flex gap-4 pt-4">
        <button type="submit" class="flex-1 py-3 bg-gradient-to-r from-primary to-secondary text-white font-semibold rounded-xl hover:opacity-90 transition-all">
          <i class="bi bi-check-lg mr-2"></i>Speichern
        </button>
        <a href="{% url 'user_settings' %}" class="px-6 py-3 glass hover:bg-gray-700/50 text-gray-300 rounded-xl transition-all">
          Abbrechen
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
