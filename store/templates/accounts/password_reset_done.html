<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zurücksetzen angefordert – JDS Appstore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            animation: pulse 15s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .reset-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }

        /* Glass Card */
        .reset-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* Brand Header */
        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3);
        }

        .brand-icon i {
            font-size: 32px;
            color: white;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
        }

        /* Info Messages */
        .info-message {
            color: #cbd5e1;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .info-message:last-of-type {
            margin-bottom: 0;
            color: #94a3b8;
            font-size: 14px;
        }

        /* Email Icon Animation */
        .email-animation {
            margin: 24px 0;
            position: relative;
        }

        .email-icon {
            font-size: 48px;
            color: #60a5fa;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Footer */
        .form-footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
        }

        .form-footer a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .form-footer a:hover {
            color: #a5b4fc;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .reset-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

<div class="reset-container">
    <div class="reset-card">
        <!-- Brand Header -->
        <div class="brand-header">
            <div class="brand-icon">
                <i class="bi bi-envelope-check-fill"></i>
            </div>
            <h2>Zurücksetzen angefordert</h2>
            <p class="subtitle">E-Mail wurde versendet</p>
        </div>

        <!-- Email Animation -->
        <div class="email-animation">
            <i class="bi bi-envelope-paper-fill email-icon"></i>
        </div>

        <!-- Info Messages -->
        <p class="info-message">
            Wenn die Angaben korrekt waren, wurde ein Link zum Zurücksetzen deines Passworts an deine E-Mail-Adresse verschickt.
        </p>
        <p class="info-message">
            <i class="bi bi-check2-circle" style="color: #10b981; margin-right: 6px;"></i>
            Du kannst diese Seite nun schließen
        </p>
        
        <!-- Footer -->
        <div class="form-footer">
            <a href="{% url 'login' %}">
                <i class="bi bi-arrow-left"></i>
                Zurück zum Login
            </a>
        </div>
    </div>
</div>

</body>
</html>
