{% extends 'base.html' %}
{% load image_tags %}

{% block title %}Entwicklerkonto erstellen{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">

  <!-- Header -->
  <div class="text-center space-y-4 mb-10">
    <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center shadow-lg">
      <i class="bi bi-code-square text-3xl text-white"></i>
    </div>
    <h1 class="text-3xl md:text-4xl font-bold text-gradient">Entwickler werden</h1>
  </div>

  <form method="post" enctype="multipart/form-data" novalidate class="glass rounded-3xl p-6 md:p-8 space-y-6">
    {% csrf_token %}

    <!-- ImgBB Option für Logo -->
    <div class="flex items-center gap-3 p-4 rounded-xl bg-slate-800/30 border border-gray-700/50">
      <input type="checkbox" name="use_imgbb" id="use_imgbb" 
             {% if form.use_imgbb.value %}checked{% endif %}
             class="w-5 h-5 rounded border-gray-600 text-primary bg-slate-700 focus:ring-primary">
      <label for="use_imgbb" class="text-sm text-gray-300 cursor-pointer select-none">
        <span class="font-medium text-primary">Logo zu ImgBB hochladen</span>
        <span class="block text-xs text-gray-500">Schnellerer Zugriff weltweit</span>
      </label>
    </div>

    <!-- Name -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-gray-300">
        Entwicklername <span class="text-red-400">*</span>
      </label>
      <input type="text" name="name" value="{{ form.name.value|default:'' }}"
             class="w-full bg-slate-800/50 border border-gray-700 rounded-xl px-4 py-3 text-gray-100" required>
    </div>

    <!-- Email -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-gray-300">
        E-Mail <span class="text-red-400">*</span>
      </label>
      <input type="email" name="email" value="{{ form.email.value|default:'' }}"
             class="w-full bg-slate-800/50 border border-gray-700 rounded-xl px-4 py-3 text-gray-100" required>
    </div>

    <!-- Website -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-gray-300">Website</label>
      <input type="url" name="website" value="{{ form.website.value|default:'' }}"
             class="w-full bg-slate-800/50 border border-gray-700 rounded-xl px-4 py-3 text-gray-100"
             placeholder="https://deine-website.com">
    </div>

    <!-- Description -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-gray-300">Beschreibung</label>
      <textarea name="description" rows="4"
                class="w-full bg-slate-800/50 border border-gray-700 rounded-xl px-4 py-3 text-gray-100">{{ form.description.value|default:'' }}</textarea>
    </div>

    <!-- Logo Upload -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-gray-300">Logo</label>
      <input type="file" name="logo" accept="image/*"
             class="block w-full text-sm text-gray-400
                    file:mr-4 file:py-3 file:px-4
                    file:rounded-xl file:border-0
                    file:text-sm file:font-semibold
                    file:bg-primary/10 file:text-primary
                    hover:file:bg-primary/20">
    </div>

    <!-- Social Media (unverändert) -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-gray-300">YouTube</label>
      <input type="url" name="youtube" value="{{ form.youtube.value|default:'' }}"
             class="w-full bg-slate-800/50 border border-gray-700 rounded-xl px-4 py-3 text-gray-100">
    </div>

    <div class="space-y-2">
      <label class="block text-sm font-medium text-gray-300">Twitter / X</label>
      <input type="url" name="twitter" value="{{ form.twitter.value|default:'' }}"
             class="w-full bg-slate-800/50 border border-gray-700 rounded-xl px-4 py-3 text-gray-100">
    </div>

    <div class="space-y-2">
      <label class="block text-sm font-medium text-gray-300">GitHub</label>
      <input type="url" name="github" value="{{ form.github.value|default:'' }}"
             class="w-full bg-slate-800/50 border border-gray-700 rounded-xl px-4 py-3 text-gray-100">
    </div>

    <!-- Submit -->
    <button type="submit" 
            class="w-full px-8 py-4 bg-gradient-to-r from-primary to-secondary text-white rounded-xl font-semibold">
      <i class="bi bi-check-lg mr-2 text-xl"></i>
      Konto erstellen
    </button>
  </form>

</div>
{% endblock %}
