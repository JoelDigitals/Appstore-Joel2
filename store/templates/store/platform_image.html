{% if platform == "windows" %}
  <div class="w-12 h-12 rounded-xl bg-blue-500/10 flex items-center justify-center me-3">
    <i class="bi bi-microsoft text-2xl text-blue-400"></i>
  </div>
{% elif platform == "linux" %}
  <div class="w-12 h-12 rounded-xl bg-yellow-500/10 flex items-center justify-center me-3">
    <i class="bi bi-terminal text-2xl text-yellow-400"></i>
  </div>
{% elif platform == "android" %}
  <div class="w-12 h-12 rounded-xl bg-green-500/10 flex items-center justify-center me-3">
    <i class="bi bi-android2 text-2xl text-green-400"></i>
  </div>
{% elif platform == "ios" %}
  <div class="w-12 h-12 rounded-xl bg-gray-500/10 flex items-center justify-center me-3">
    <i class="bi bi-apple text-2xl text-gray-300"></i>
  </div>
{% elif platform == "mac" or platform == "macos" %}
  <div class="w-12 h-12 rounded-xl bg-gray-400/10 flex items-center justify-center me-3">
    <i class="bi bi-apple text-2xl text-gray-400"></i>
  </div>
{% endif %}
